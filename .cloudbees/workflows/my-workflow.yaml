apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My workflow

on:
  push:
    branches:
      - '**'
jobs:
  ci-job: # <1>
    steps:
      - uses: docker://alpine/git:latest # <2>
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - name: checkout # <3>
        uses: https://github.com/cloudbees-io/checkout@v1
      - name: Build Go app # <4>
        uses: docker://golang:1.20
        run: |
          go build -v ./...
      - name: Run tests # <5>
        uses: docker://golang:1.20
        run: |
          go test -v ./...